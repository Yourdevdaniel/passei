<script>
function falhaInicial(evento){const tela=document.getElementById('boot-loading');if(!tela)return;if(evento.type==='error'&&!(evento.error||(evento.target instanceof HTMLScriptElement&&evento.target.type==='module')))return;document.getElementById('boot-spinner').hidden=true;document.getElementById('boot-title').textContent='Não foi possível carregar o Passei';document.getElementById('boot-message').textContent='Confira sua conexão e tente recarregar. Seus dados salvos não serão apagados.';document.getElementById('boot-retry').hidden=false;tela.setAttribute('aria-busy','false');tela.setAttribute('role','alert')}

</script>

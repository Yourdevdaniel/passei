<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passei · notas no modelo da ULBRA</title>
<meta name="description" content="Descubra quanto precisa tirar na G1, na G2 e no exame. Importa as notas do Canvas e simula a prova.">
<meta property="og:title" content="Passei: quanto eu preciso tirar?">
<meta property="og:description" content="Calculadora de G1, G2 e exame final no modelo de notas da ULBRA. Importa as notas do Canvas e simula a prova.">
<meta name="theme-color" content="#15123a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2315123a'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='%23f2b48a' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#15123a; --navy2:#221e5e; --peach:#f2b48a; --peach2:#e8955f; --mint:#cdeedd; --cyan:#48d1e0; --lav:#8c84ff;
  --bg:#f4f3fa; --card:#fff; --ink:#15123a; --mut:#6c6a8e; --line:#e6e4f2; --soft:#f0eff9;
  --ok:#1d9a62; --okbg:#e2f6ec; --warn:#c97a1c; --warnbg:#fff1df; --bad:#d24545; --badbg:#fde7e7;
  --r:22px; --shadow:0 1px 2px rgba(21,18,58,.04),0 12px 32px -12px rgba(21,18,58,.14);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c0b1f; --card:#17153a; --ink:#efeefe; --mut:#9e9cc8; --line:#2a2758; --soft:#201d4a;
  --ok:#4fd393; --okbg:#123326; --warn:#ffb85c; --warnbg:#35260f; --bad:#ff7d7d; --badbg:#3b1619;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px;border-radius:8px}
img.slot{display:block;max-width:100%;height:auto;object-fit:contain}

/* ---------- estrutura: menu lateral + conteúdo ---------- */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--navy);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.side svg.deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.28}
.side>*:not(.deco){position:relative}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0 8px 18px}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--peach);display:grid;place-items:center}
.side-lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8f8cc4;margin:16px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;color:#cfcdf4;font-weight:500;transition:background .2s,color .2s}
.nav:hover{background:rgba(255,255,255,.08);color:#fff}
.nav.on{background:#fff;color:var(--navy);font-weight:700}
.nav .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .mp{font-size:13px;font-weight:700;opacity:.8}
.nav.add{color:var(--peach)}
.dot{width:9px;height:9px;border-radius:50%;background:#6f6ca6;flex:none}
.dot.ok{background:#4fd393}.dot.warn{background:#ffb85c}.dot.bad{background:#ff7d7d}.dot.peach{background:var(--peach)}
.side-list{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;min-height:0;scrollbar-width:thin}
.side-foot{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.side-foot small{color:#8f8cc4;font-size:12px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 16px;font-weight:600;transition:transform .15s,background .2s,border-color .2s}
.btn:active{transform:scale(.96)}
.btn.peach{background:var(--peach);color:var(--navy)}
.btn.peach:hover{background:#f6c4a0}
.btn.line{border:1.5px solid var(--line);background:var(--card)}
.btn.line:hover{border-color:var(--lav)}
.btn.glass{background:rgba(255,255,255,.1);color:#fff}
.btn.glass:hover{background:rgba(255,255,255,.18)}
.content{padding:28px clamp(16px,3vw,40px) 80px;min-width:0}
.wrap{max-width:1040px;margin:0 auto;position:relative}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:relative;height:auto;padding:14px 12px 10px;gap:4px}
  .logo{margin:0 4px 10px}
  .side-lbl{display:none}
  .side-list{flex-direction:row;overflow-x:auto;flex:none;padding-bottom:4px;scrollbar-width:none}
  .nav{width:auto;white-space:nowrap;background:rgba(255,255,255,.08);border-radius:999px;padding:8px 14px}
  .nav .nm{max-width:170px}
  .side-foot{position:absolute!important;top:12px;right:12px;margin:0}
  .side-foot small{display:none}
  .side-foot .btn{padding:8px 14px;font-size:14px}
  .content{padding-top:18px}
}

/* cabeçalho de página */
.ph{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--mut);font-weight:500;margin-bottom:2px}
.crumb button{color:var(--lav);font-weight:600}
.crumb button:hover{text-decoration:underline}
.titulo{font-size:clamp(20px,2.6vw,28px);text-overflow:ellipsis;font-weight:800;letter-spacing:-.03em;line-height:1.15;background:transparent;border:1.5px dashed transparent;border-radius:12px;padding:2px 8px;margin-left:-8px;width:100%;transition:border-color .2s,background .2s}
.titulo:hover{border-color:var(--line)}
.titulo:focus{outline:none;border-color:var(--lav);border-style:solid;background:var(--card)}
.ph-main{flex:1;min-width:240px}
.ph-act{display:flex;gap:8px}

/* painel */
.banner{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:var(--r);padding:28px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
.banner h1{font-size:clamp(26px,3.6vw,40px);line-height:1.05;margin:0;letter-spacing:-.03em;font-weight:800}
.banner h1 em{font-style:normal;color:var(--peach)}
.banner p{margin:8px 0 16px;color:#b9b7e6;max-width:44ch}
.banner .slot{width:170px;margin:-18px 0 -28px;flex:none}
@media (max-width:640px){.banner .slot{display:none}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:16px 18px}
.stat small{display:block;color:var(--mut);font-weight:500;font-size:13px}
.stat b{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sec-h h2{font-size:18px;margin:0;letter-spacing:-.01em}
.sec-h span{color:var(--mut);font-size:13px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:32px}
.dcard{padding:18px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;transition:transform .2s,border-color .2s}
.dcard:hover{transform:translateY(-3px);border-color:var(--lav)}
.dcard h3{margin:0;font-size:16px;line-height:1.25;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard .chip{margin:0;justify-self:start}
.dcard p{margin:0;color:var(--mut);font-size:14px;grid-column:1}
.dcard .ring{grid-row:1/4;grid-column:2}
.dcard .mini{grid-column:1/-1;display:flex;gap:14px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px;font-size:13px;color:var(--mut)}
.dcard .mini b{color:var(--ink)}
.dcard.novo{border:2px dashed var(--line);box-shadow:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;color:var(--mut);font-weight:600}
.dcard.novo:hover{color:var(--lav)}
.passos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
@media (max-width:760px){.passos{grid-template-columns:1fr}}
.passo{padding:20px}
.passo i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;font-weight:800;margin-bottom:12px}
@media (prefers-color-scheme:dark){.passo i{background:var(--lav)}}
.passo h3{margin:0 0 4px;font-size:16px}
.passo p{margin:0;color:var(--mut);font-size:14px}
.agenda{padding:6px 18px;margin-bottom:32px}
.ag{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.ag:last-child{border:0}
.ag .dt{font-weight:700;font-size:13px;background:var(--soft);border-radius:10px;padding:6px 10px;min-width:96px;text-align:center}
.ag .dt.late{background:var(--badbg);color:var(--bad)}
.ag b{display:block}
.ag small{color:var(--mut)}
.ag em{font-style:normal;color:var(--mut);font-size:14px;white-space:nowrap}
.vazio-txt{color:var(--mut);padding:14px 0;margin:0;font-size:14px}
.pg-h{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.03em;margin:0}
.stat .inp.big{font-size:22px;padding:4px 8px;margin-top:4px;text-align:left}
.ag.cr{grid-template-columns:1fr auto 110px}
.ag.cr em{text-align:right;font-weight:700;color:var(--ink)}
.cr-nome{text-align:left;display:flex;align-items:center;gap:10px;min-width:0}
.cr-nome b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-nome:hover b{color:var(--lav)}
.cr-in{display:flex;align-items:center;gap:8px}
.cr-in .inp{width:64px}
@media (max-width:560px){.ag.cr{grid-template-columns:1fr auto}.ag.cr em{grid-column:1/-1;text-align:left}.cr-in small{display:none}}

/* trilha G1 → G2 → média → exame */
.trilha{padding:18px 22px;margin-bottom:16px;overflow-x:auto}
.tr{display:flex;align-items:flex-start;min-width:440px}
.tr-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center}
.tr-step:not(:first-child)::before{content:"";position:absolute;top:21px;right:50%;width:100%;height:4px;background:var(--line);border-radius:2px}
.tr-step.done:not(:first-child)::before{background:var(--ok)}
.tr-node{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--card);border:3px solid var(--line);color:var(--mut);transition:.3s}
.tr-step.done .tr-node{border-color:var(--ok);color:var(--ink)}
.tr-step.cur .tr-node{border-color:var(--peach2);color:var(--ink);box-shadow:0 0 0 6px rgba(242,180,138,.25)}
.tr-step.fim.ok .tr-node{background:var(--ok);border-color:var(--ok);color:#fff}
.tr-step.fim.bad .tr-node{background:var(--bad);border-color:var(--bad);color:#fff}
.tr-step b{font-size:13.5px}
.tr-step small{font-size:12px;color:var(--mut);margin-top:-4px}
.tr-step.cur small{color:var(--peach2);font-weight:700}
.logo small{display:block;font-size:11px;font-weight:500;color:#8f8cc4;letter-spacing:0;line-height:1.2}
.selo{display:inline-block;font-size:12.5px;font-weight:600;color:var(--navy);background:var(--mint);border-radius:999px;padding:4px 12px;margin-top:12px}

/* ---------- cartões ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.result{padding:24px;display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center}
@media (max-width:720px){.result{grid-template-columns:1fr;justify-items:center;text-align:center}}
.result h2{margin:0;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em;line-height:1.15}
.result .sub{margin:6px 0 0;color:var(--mut);font-size:16px}
.result .sub b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--mut);margin-bottom:10px}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--mut);margin-top:10px}
.res-img{width:120px}
.ef{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
@media (max-width:720px){.ef{justify-content:center}}

/* anel */
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0}
.ring-bg{fill:none;stroke:var(--soft)}
.ring-fg{fill:none;stroke:var(--lav);stroke-linecap:round;transition:stroke .4s}
.ring.ok .ring-fg{stroke:var(--ok)} .ring.warn .ring-fg{stroke:var(--warn)} .ring.bad .ring-fg{stroke:var(--bad)} .ring.peach .ring-fg{stroke:var(--peach2)}
.ring-in{position:relative;text-align:center;line-height:1}
.ring-in strong{display:block;font-weight:800;letter-spacing:-.03em}
.ring-in small{display:block;color:var(--mut);font-size:12px;margin-top:4px}

/* abas */
.tabs{display:flex;justify-content:center;margin:28px 0 20px}
.seg{position:relative;display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{position:relative;z-index:1;padding:9px 20px;border-radius:999px;font-weight:600;color:var(--mut);transition:color .3s}
.seg button[aria-selected=true]{color:#fff}
.seg-ind{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:var(--navy)}
@media (prefers-color-scheme:dark){.seg-ind{background:var(--lav)}}
.seg.small{box-shadow:none;background:var(--soft);border:0;padding:3px}
.seg.small button{padding:6px 14px;font-size:13.5px}

/* graus */
.graus{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:860px){.graus{grid-template-columns:1fr}}
.gc{padding:22px}
.gc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.gc-tag{font-size:30px;font-weight:800;letter-spacing:-.03em}
.gc-peso{margin-left:10px;font-size:12px;font-weight:700;color:var(--mut);background:var(--soft);padding:3px 9px;border-radius:999px;vertical-align:6px}
.split{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 14px;color:var(--mut);font-size:14px}
.split label{display:flex;align-items:center;gap:8px}
.split b{color:var(--ink)}
.inp{background:var(--soft);border:1.5px dashed var(--line);border-radius:12px;padding:8px 10px;width:100%;text-align:center;font-weight:600;transition:border-color .2s,background .2s}
.inp:hover{border-color:var(--lav)}
.inp:focus{outline:none;border-style:solid;border-color:var(--lav);background:var(--card)}
.inp::placeholder{color:var(--mut);opacity:.6}
.inp.mini{width:64px;padding:5px 8px}
.inp.big{font-size:28px;font-weight:800;letter-spacing:-.02em;padding:10px 8px}
.inp.over{border-color:var(--warn);border-style:solid}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld>span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:500}
.fld-row{display:flex;align-items:center;gap:8px}
.fld-row em{font-style:normal;color:var(--mut);white-space:nowrap;font-weight:500}
.link{color:var(--lav);font-weight:600;font-size:14px;margin-top:14px}
.link:hover{text-decoration:underline}
.extra{margin-top:14px;max-width:220px}

/* lista de notas */
.itens{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:8px;align-items:center;background:var(--soft);border-radius:14px;padding:8px 8px 8px 8px;overflow:hidden}
@media (max-width:520px){
  .item{grid-template-columns:auto 1fr auto;grid-template-areas:"t n d" "v v c"}
  .item .tipo{grid-area:t}.item .nome{grid-area:n}.item .del{grid-area:d}.item .nota{grid-area:v}.item .cal,.item .data{grid-area:c;justify-self:end}.item .del{justify-self:end}
}
.tipo{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:9px;min-width:84px;transition:.2s}
.t-trab .tipo{background:rgba(140,132,255,.16);color:var(--lav)}
.t-prova .tipo{background:rgba(242,180,138,.22);color:var(--peach2)}
.t-extra .tipo{background:var(--okbg);color:var(--ok)}
.nome{background:transparent;border:0;padding:6px 4px;min-width:0;font-weight:500}
.nome:focus{outline:none;background:var(--card);border-radius:8px}
.nota{display:flex;align-items:center;gap:4px;color:var(--mut)}
.nota .inp{width:58px;padding:6px 4px;background:var(--card)}
.data{background:var(--card);border:0;border-radius:9px;padding:6px 8px;font-size:13px;color:var(--mut);width:132px}
.ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mut);transition:.2s}
.ico:hover{background:var(--card);color:var(--ink)}
.ico.del:hover{color:var(--bad)}
.adds{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.adds button{padding:7px 13px;border-radius:999px;border:1.5px dashed var(--line);color:var(--mut);font-weight:600;font-size:13.5px;transition:.2s}
.adds button:hover{border-color:var(--lav);color:var(--lav)}
.aviso{font-size:13px;color:var(--warn);margin:10px 0 0}

/* simulador */
.sim{padding:26px;display:grid;grid-template-columns:1.1fr 1fr;gap:30px}
@media (max-width:860px){.sim{grid-template-columns:1fr}}
.sl{margin-bottom:26px}
.sl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sl-top label{font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.sl-val{display:flex;align-items:baseline;gap:6px;flex:none}
.sl-val small{font-size:14px;color:var(--mut);font-weight:500}
.sl-inp{width:3.4em;font-size:28px;font-weight:800;letter-spacing:-.02em;text-align:right;background:var(--soft);border:1.5px dashed var(--line);border-radius:12px;padding:2px 8px;transition:border-color .2s,background .2s}
.sl-inp:hover{border-color:var(--lav)}
.sl-inp:focus{outline:none;border-style:solid;border-color:var(--lav);background:var(--card)}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;flex:0 0 auto;width:auto;line-height:1.4}
.tag.real{background:var(--okbg);color:var(--ok)}
.tag.simu{background:rgba(140,132,255,.16);color:var(--lav);cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--lav) var(--p),var(--soft) var(--p));outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:6px solid var(--navy);box-shadow:0 4px 12px rgba(21,18,58,.3);cursor:grab;transition:transform .15s}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.15);cursor:grabbing}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:6px solid var(--navy);cursor:grab}
@media (prefers-color-scheme:dark){input[type=range]::-webkit-slider-thumb{border-color:var(--lav)}input[type=range]::-moz-range-thumb{border-color:var(--lav)}}
.sim-out{background:var(--soft);border-radius:18px;padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.sim-out h3{margin:10px 0 0;font-size:22px;letter-spacing:-.02em}
.sim-out p{margin:0;color:var(--mut)}
.grid-t{margin-top:8px}
.grid-t h4{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
@media (max-width:600px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{border-radius:12px;padding:8px 2px;text-align:center;background:var(--soft);border:2px solid transparent;transition:transform .2s}
.tile:hover{transform:translateY(-2px)}
.tile small{display:block;font-size:11px;color:var(--mut)}
.tile b{font-size:15px}
.tile.ok{background:var(--okbg);color:var(--ok)} .tile.warn{background:var(--warnbg);color:var(--warn)} .tile.bad{background:var(--badbg);color:var(--bad)} .tile.mid{background:rgba(140,132,255,.14);color:var(--lav)}
.tile.cur{border-color:currentColor}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* fórmulas */
.forms{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
@media (max-width:860px){.forms{grid-template-columns:1fr}}
.fc{padding:24px 26px}
.fc .eq{display:flex;align-items:center;gap:14px;font-weight:800;font-size:clamp(20px,2.6vw,28px);letter-spacing:-.02em}
.frac{display:flex;flex-direction:column;align-items:center}
.frac .barra{height:8px;width:100%;border-radius:4px;margin:6px 0;transform-origin:left}
.fc .eq .res{font-size:1.5em}
.fc p{margin:12px 0 0;color:var(--mut);font-size:14px}

/* gaveta, modal, toast */
.veu{position:fixed;inset:0;background:rgba(12,11,31,.55);backdrop-filter:blur(4px);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--card);z-index:51;padding:24px;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.drawer h3{margin:0 0 20px;font-size:22px}
.drawer .row{margin-bottom:18px}
.drawer .row>span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:500}
.drawer .inp{text-align:left}
.drawer .hint{font-size:12.5px;color:var(--mut);margin:6px 0 0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500}
.switch input{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:.2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{left:21px}
.danger{color:var(--bad);font-weight:600;margin-top:10px}
.modal{position:fixed;left:50%;top:50%;z-index:51;width:min(520px,calc(100% - 32px));transform:translate(-50%,-50%);padding:26px}
.modal h3{margin:0 0 4px;font-size:22px}
.modal>p{margin:0 0 16px;color:var(--mut)}
.drop{border:2px dashed var(--line);border-radius:18px;padding:26px;text-align:center;transition:.2s;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.drop:hover,.drop.on{border-color:var(--lav);background:var(--soft)}
.drop b{font-size:16px}
.drop span{color:var(--mut);font-size:14px}
.drop .slot{width:110px}
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lav),var(--peach))}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:16px 0 10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
textarea{width:100%;min-height:90px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);padding:12px;font:13px/1.4 ui-monospace,Consolas,monospace;color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--lav)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;padding:12px 20px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);font-weight:500;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad)}
.dragzone{position:fixed;inset:12px;border:3px dashed var(--peach);border-radius:28px;z-index:70;display:grid;place-items:center;background:rgba(21,18,58,.75);color:#fff;font-size:24px;font-weight:700;pointer-events:none}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:40px}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="logic.js"></script>
<script>
const { useState, useEffect, useLayoutEffect, useRef } = React;
const html = htm.bind(React.createElement);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = RM ? 0 : 1; // multiplica as durações

// ---------- dados (só no navegador) ----------
const KEY = 'notas-v2';
const grauVazio = () => ({ modo: 'simples', trabMax: '4', trab: '', prova: '', extra: '', itens: [] });
const novaDisc = nome => ({ id: uid(), nome, g1: grauVazio(), g2: grauVazio(), ef: '', sub: '', minimo: '', limitar: true });
function carregar() {
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (v?.lista?.length) return v; } catch { }
  try { // dados da versão anterior
    const o = JSON.parse(localStorage.getItem('calc-media'));
    if (o?.lista?.length) return { cur: 0, lista: o.lista.map(d => ({ ...novaDisc(d.nome), ef: d.ef || '', sub: d.sub || '', minimo: d.minimo || '', limitar: d.limitar !== false,
      g1: { ...grauVazio(), ...d.g1, modo: 'simples', trabMax: String(d.g1.trabMax), itens: [] }, g2: { ...grauVazio(), ...d.g2, modo: 'simples', trabMax: String(d.g2.trabMax), itens: [] } })) };
  } catch { }
  return { cur: 0, lista: [novaDisc('Minha disciplina')] };
}

const tom = (v, min) => v == null ? '' : v >= min - EPS ? 'ok' : v >= min * .7 ? 'warn' : 'bad';

// ---------- carregar libs só quando precisar ----------
const libs = {};
const script = src => libs[src] ||= new Promise((ok, err) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => err(new Error('sem internet para baixar o leitor')); document.head.appendChild(s); });
async function lerArquivo(file, prog) {
  const ocr = async imgs => {
    await script('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    let i = 0, txt = '';
    const w = await Tesseract.createWorker('por', 1, { logger: m => m.status === 'recognizing text' && prog((i + m.progress) / imgs.length, 'Lendo as notas…') });
    for (; i < imgs.length; i++) txt += (await w.recognize(imgs[i])).data.text + '\n';
    await w.terminate();
    return txt;
  };
  if (file.type.startsWith('image/')) { prog(0, 'Preparando leitura…'); return ocr([file]); }
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
    prog(0, 'Abrindo PDF…');
    await script('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let txt = '';
    for (let p = 1; p <= pdf.numPages; p++) txt += (await (await pdf.getPage(p)).getTextContent()).items.map(x => x.str + (x.hasEOL ? '\n' : ' ')).join('') + '\n';
    if (/G[12]\s*[-–]|G[12]\s+[\d,]+\s*%/.test(txt)) return txt;
    // PDF "impresso" (Microsoft Print to PDF) não tem texto: vira imagem e passa no OCR
    const imgs = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p), vp = page.getViewport({ scale: 2.5 }), c = document.createElement('canvas');
      c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      imgs.push(c);
    }
    return ocr(imgs);
  }
  return file.text();
}

// ---------- peças ----------
function Img({ name, className = '' }) {
  const [ok, setOk] = useState(true);
  return ok ? html`<img className=${'slot ' + className} src=${'img/' + name + '.webp'} alt="" onError=${() => setOk(false)}/>` : null;
}

function Num({ v }) {
  const ref = useRef(), o = useRef({ v: v ?? 0 });
  useLayoutEffect(() => {
    if (v == null || !isFinite(v)) { ref.current.textContent = '–'; return; }
    const tw = gsap.to(o.current, { v, duration: .9 * T, ease: 'power3.out', onUpdate: () => ref.current && (ref.current.textContent = fmt(o.current.v)) });
    if (!T) ref.current.textContent = fmt(v);
    return () => tw.kill();
  }, [v]);
  return html`<span ref=${ref}>${v == null ? '–' : fmt(v)}</span>`;
}

function Ring({ v, max = 10, size = 140, stroke = 12, tone = '', children }) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, ref = useRef();
  useLayoutEffect(() => {
    const f = v == null || !max ? 0 : Math.max(0, Math.min(1, v / max));
    gsap.to(ref.current, { strokeDashoffset: C * (1 - f), opacity: f > 0 ? 1 : 0, duration: 1.1 * T, ease: 'power3.out' }); // sem o ponto solto quando é 0
  }, [v, max, C]);
  return html`<div className=${'ring ' + tone} style=${{ width: size, height: size }}>
    <svg viewBox=${`0 0 ${size} ${size}`}><circle className="ring-bg" cx=${size / 2} cy=${size / 2} r=${r} strokeWidth=${stroke}/>
    <circle ref=${ref} className="ring-fg" cx=${size / 2} cy=${size / 2} r=${r} strokeWidth=${stroke} strokeDasharray=${C} strokeDashoffset=${C} transform=${`rotate(-90 ${size / 2} ${size / 2})`}/></svg>
    <div className="ring-in">${children}</div></div>`;
}

function Seg({ value, options, onChange, small, label }) {
  const ref = useRef(), ind = useRef(), first = useRef(true);
  useLayoutEffect(() => {
    const move = () => { const b = ref.current?.querySelector(`[data-v="${value}"]`); if (b) gsap.to(ind.current, { x: b.offsetLeft - 4, width: b.offsetWidth, duration: first.current ? 0 : .5 * T, ease: 'power3.inOut' }); first.current = false; };
    move(); document.fonts?.ready.then(move);
    addEventListener('resize', move); return () => removeEventListener('resize', move);
  }, [value]);
  return html`<div className=${'seg' + (small ? ' small' : '')} ref=${ref} role="tablist" aria-label=${label}>
    <i className="seg-ind" ref=${ind} style=${{ left: 4 }}/>
    ${options.map(([v, l]) => html`<button key=${v} role="tab" aria-selected=${v === value} data-v=${v} onClick=${() => onChange(v)}>${l}</button>`)}
  </div>`;
}

const Inp = ({ value, onChange, className = '', placeholder = '–', label, max }) => html`<input type="text" inputMode="decimal" aria-label=${label}
  className=${'inp ' + className + (max != null && (num(value) ?? 0) > max + EPS ? ' over' : '')} value=${value ?? ''} placeholder=${placeholder}
  onFocus=${e => e.target.select()} onKeyDown=${e => e.key === 'Enter' && e.target.blur()}
  onChange=${e => onChange(e.target.value.replace(/[^\d.,]/g, ''))}/>`;

const Ic = {
  cal: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>`,
  x: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  gear: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
  up: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>`,
  check: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15123a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg>`,
};

// ---------- resultado no topo ----------
function Resultado({ r, d, set }) {
  const box = useRef(), min = r.min;
  useLayoutEffect(() => { if (T) gsap.fromTo(box.current, { scale: .97 }, { scale: 1, duration: .9, ease: 'elastic.out(1,.5)' }); }, [r.status]);
  let ring = { v: null, max: 10, tone: '', top: null, bottom: '' }, chip = ['', 'Comece aqui'], h = 'Coloque suas notas', sub = 'Deixe vazio o que ainda não saiu. A gente calcula quanto falta.', form = 'MP = (G1 + G2 × 2) ÷ 3', img = 'vazio', ef = false;
  if (r.status === 'falta') {
    const p = r.precisa, onde = (p.pend.length > 2 ? 'notas que faltam' : p.pend.map(x => x.nome.toLowerCase()).join(' + ')) + ' do ' + r.falta;
    ring = { v: Math.max(0, p.valor), max: p.max, tone: 'peach', bottom: '/ ' + fmt(p.max) };
    form = r.falta === 'G2' ? `G2 ≥ (${fmt(3 * min)} − ${fmt(r.G1)}) ÷ 2 = ${fmt(r.alvo)}` : `G1 ≥ ${fmt(3 * min)} − ${fmt(r.G2)} × 2 = ${fmt(r.alvo)}`;
    if (p.valor <= EPS) { chip = ['ok', 'Garantido']; h = 'Você já passou'; sub = html`Mesmo tirando 0 no que falta do ${r.falta}.`; img = 'aprovado'; ring.tone = 'ok'; }
    else if (p.valor <= p.max + EPS) { chip = [p.valor / p.max > .8 ? 'warn' : '', 'Falta pouco']; h = html`Precisa de ${fmt(p.valor)}`; sub = html`Onde: <b>${onde}</b>, que vale ${fmt(p.max)}.`; img = 'simulador'; }
    else {
      const melhor = Math.min(d.limitar ? 10 : Infinity, r[r.falta.toLowerCase()].known + r[r.falta.toLowerCase()].e + p.max);
      const mp = r.falta === 'G2' ? (r.G1 + 2 * melhor) / 3 : (melhor + 2 * r.G2) / 3, efp = (3 * min - mp) / 2;
      chip = ['bad', 'Direto não dá']; h = 'Vai pro exame'; img = 'exame'; ring.tone = 'bad';
      sub = efp <= 10 ? html`Mesmo com nota cheia, precisa de <b>${fmt(efp)}</b> no exame.` : 'Nem o exame salva. Só substituição.';
    }
  } else if (r.mp != null) {
    ring = { v: r.mf ?? r.mp, max: 10, tone: tom(r.mf ?? r.mp, min), bottom: r.mf != null ? 'média final' : 'média' };
    form = r.mf != null ? `MF = (${fmt(r.mp)} + ${fmt(num(d.ef))} × 2) ÷ 3 = ${fmt(r.mf)}` : `MP = (${fmt(r.G1)} + ${fmt(r.G2)} × 2) ÷ 3 = ${fmt(r.mp)}`;
    if (r.status === 'aprovado') { chip = ['ok', 'Aprovado']; h = 'Passou direto!'; sub = r.mp - min > EPS ? html`Sobrou <b>${fmt(r.mp - min)}</b> de folga.` : 'Na conta certinha.'; img = 'aprovado'; }
    else {
      ef = true;
      if (r.status === 'exame') { chip = ['warn', 'Exame final']; h = html`Precisa de ${fmt(r.efPrecisa)} no exame`; sub = 'Coloque a nota do exame quando sair.'; img = 'exame'; }
      else if (r.status === 'impossivel') { chip = ['bad', 'Exame não salva']; h = 'Só com substituição'; sub = html`O exame pediria ${fmt(r.efPrecisa)}. Abra os ajustes.`; img = 'reprovado'; }
      else if (r.status === 'aprovado-exame') { chip = ['ok', 'Aprovado']; h = 'Passou no exame!'; sub = html`Média final <b>${fmt(r.mf)}</b>.`; img = 'aprovado'; }
      else { chip = ['bad', 'Reprovado']; h = 'Não deu dessa vez'; sub = html`Precisava de ${fmt(r.efPrecisa)} no exame.`; img = 'reprovado'; }
    }
    if (r.subUsada) sub = html`${sub} Substituição no lugar do ${r.subUsada}.`;
  }
  return html`<section className="card result anim-in" ref=${box} aria-live="polite">
    <${Ring} v=${ring.v} max=${ring.max} tone=${ring.tone} size=${150} stroke=${13}>
      <strong style=${{ fontSize: 40 }}><${Num} v=${ring.v}/></strong><small>${ring.bottom || 'de 10'}</small>
    <//>
    <div>
      <span className=${'chip ' + chip[0]}>${chip[1]}</span>
      <h2>${h}</h2>
      <p className="sub">${sub}</p>
      ${ef && html`<div className="ef"><span>Nota do exame</span><div style=${{ width: 90 }}><${Inp} label="Nota do exame" value=${d.ef} placeholder="?" onChange=${v => set(x => ({ ...x, ef: v }))}/></div><span className="sub" style=${{ margin: 0 }}>/ 10</span></div>`}
      <div className="mono">${form}</div>
    </div>
    <${Img} name=${img} className="res-img"/>
  </section>`;
}

// ---------- G1 / G2 ----------
function Item({ it, onChange, onDel }) {
  const ref = useRef(), [cal, setCal] = useState(!!it.data);
  const nomes = { trab: 'Trabalho', prova: 'Prova', extra: 'Extra' }, prox = { trab: 'prova', prova: 'extra', extra: 'trab' };
  useLayoutEffect(() => { if (T) gsap.from(ref.current, { height: 0, opacity: 0, paddingTop: 0, paddingBottom: 0, duration: .35, ease: 'power2.out', clearProps: 'all' }); }, []);
  const del = () => gsap.to(ref.current, { height: 0, opacity: 0, paddingTop: 0, paddingBottom: 0, marginTop: -8, duration: .3 * T, ease: 'power2.in', onComplete: onDel });
  return html`<li ref=${ref} className=${'item t-' + it.tipo}>
    <button className="tipo" title="Clique para trocar o tipo" onClick=${() => onChange({ tipo: prox[it.tipo] })}>${nomes[it.tipo]}</button>
    <input className="nome" value=${it.nome} placeholder=${nomes[it.tipo]} aria-label="Nome" onChange=${e => onChange({ nome: e.target.value })}/>
    <div className="nota"><${Inp} label="Nota" value=${it.nota} placeholder="?" max=${it.tipo === 'extra' ? null : num(it.max)} onChange=${v => onChange({ nota: v })}/>
      ${it.tipo !== 'extra' && html`<span>/</span><${Inp} label="Vale quanto" value=${it.max} placeholder="vale" onChange=${v => onChange({ max: v })}/>`}</div>
    ${cal ? html`<input type="date" className="data" aria-label="Data" value=${it.data} onChange=${e => onChange({ data: e.target.value })}/>`
          : html`<button className="ico cal" title="Adicionar data (opcional)" onClick=${() => setCal(true)}>${Ic.cal}</button>`}
    <button className="ico del" title="Remover" onClick=${del}>${Ic.x}</button>
  </li>`;
}

function Grau({ k, g, gr, setG, min, usado }) {
  const [extra, setExtra] = useState(false);
  const tm = gr.trabMax, pm = gr.provaMax, lista = g.modo === 'lista';
  const trocar = m => setG(g => {
    if (m === g.modo) return g;
    if (m === 'lista') {
      if (g.itens.length) return { ...g, modo: m };
      const t = num(g.trabMax) ?? 0, itens = [];
      if (t > 0) itens.push({ id: uid(), nome: 'Trabalhos', tipo: 'trab', nota: g.trab, max: fmt(t), data: '' });
      if (t < 10) itens.push({ id: uid(), nome: 'Prova', tipo: 'prova', nota: g.prova, max: fmt(10 - t), data: '' });
      if (num(g.extra)) itens.push({ id: uid(), nome: 'Ponto extra', tipo: 'extra', nota: g.extra, max: '', data: '' });
      return { ...g, modo: m, itens };
    }
    const soma = tipo => { const xs = g.itens.filter(i => i.tipo === tipo && num(i.nota) !== null); return xs.length ? fmt(xs.reduce((s, i) => s + num(i.nota), 0)) : ''; };
    const cg = calcGrau({ ...g, modo: 'lista' }, false);
    return { ...g, modo: m, trab: soma('trab'), prova: soma('prova'), extra: soma('extra'), trabMax: Math.abs(cg.trabMax + cg.provaMax - 10) < EPS ? fmt(cg.trabMax) : g.trabMax };
  });
  const setItem = (id, p) => setG(g => ({ ...g, itens: g.itens.map(i => i.id === id ? { ...i, ...p } : i) }));
  const add = tipo => setG(g => {
    const usados = calcGrau({ ...g, modo: 'lista' }, false), sobra = Math.max(0, 10 - usados.trabMax - usados.provaMax);
    const n = g.itens.filter(i => i.tipo === tipo).length + 1;
    return { ...g, itens: [...g.itens, { id: uid(), nome: { trab: 'Trabalho ', prova: 'Prova ', extra: 'Ponto extra ' }[tipo] + n, tipo, nota: '', max: tipo === 'extra' || !sobra ? '' : fmt(sobra), data: '' }] };
  });
  const vale = tm + pm;
  return html`<section className="card gc anim-in">
    <div className="gc-head">

// ---------- simulador ----------
function Slider({ label, value, max, real, onChange, onReset }) {
  const step = .05, pct = max ? (value / max) * 100 : 0, simulado = real == null || Math.abs(real - value) > EPS;
  const [txt, setTxt] = useState(null); // texto enquanto digita ("3," ainda não é número)
  const digitar = t => { t = t.replace(/[^\d.,]/g, ''); setTxt(t); const n = num(t); if (n !== null) onChange(Math.min(max, Math.max(0, n))); };
  return html`<div className="sl">
    <div className="sl-top"><label>${label}${real != null && (simulado
      ? html`<button className="tag simu" title="Voltar para sua nota" onClick=${onReset}>simulado <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" style=${{ verticalAlign: -1 }}><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg></button>`
      : html`<span className="tag real">sua nota</span>`)}</label>
      <span className="sl-val"><input className="sl-inp" type="text" inputMode="decimal" aria-label=${label + ' (digite)'} title="Clique e digite"
        value=${txt ?? fmt(value)} onFocus=${e => { setTxt(fmt(value)); e.target.select(); }} onChange=${e => digitar(e.target.value)}
        onBlur=${() => setTxt(null)} onKeyDown=${e => e.key === 'Enter' && e.target.blur()}/><small>/ ${fmt(max)}</small></span></div>
    <input type="range" min="0" max=${max} step=${step} value=${value} aria-label=${label} style=${{ '--p': pct + '%' }} onChange=${e => onChange(+e.target.value)}/>
  </div>`;
}

function Simulador({ r }) {
  const min = r.min, g2 = r.g2, realG1 = r.G1;
  const [g1s, setG1] = useState(null), [t2s, setT2] = useState(null);
  const G1 = g1s ?? realG1 ?? 6;
  const tMax = g2.trabMax, pMax = g2.provaMax;
  const realT2 = g2.trabTem;
  const T2 = Math.min(tMax, t2s ?? realT2 ?? 0);
  const s = simular(G1, T2, g2.e, pMax, min);
  let h, p, tone = 'peach';
  if (s.prova <= EPS) { h = 'Já garantido'; p = 'Pode tirar 0 na prova da G2.'; tone = 'ok'; }
  else if (s.prova <= pMax + EPS) { h = html`${fmt(s.prova)} na prova da G2`; p = html`Para fechar a G2 em ${fmt(s.alvo)}.`; tone = s.prova / pMax > .8 ? 'warn' : 'peach'; }
  else {
    const t = s.alvo - pMax - g2.e; tone = 'bad';
    h = 'Direto não dá';
    p = t <= tMax + EPS ? html`Com prova cheia, precisa de ${fmt(t)} nos trabalhos.` : 'Com essa G1, vai pro exame.';
  }
  const tiles = Array.from({ length: 11 }, (_, i) => { const x = simular(i, T2, g2.e, pMax, min).prova; return { i, x, c: x <= EPS ? 'ok' : x > pMax + EPS ? 'bad' : x / pMax > .8 ? 'warn' : 'mid' }; });
  return html`<section className="card sim anim-in">
    <div>
      <${Slider} label="Se eu tirar na G1" value=${G1} max=${10} real=${realG1} onChange=${setG1} onReset=${() => setG1(null)}/>
      ${tMax > 0 && html`<${Slider} label="Trabalhos da G2 (já tenho)" value=${T2} max=${tMax} real=${realT2} onChange=${setT2} onReset=${() => setT2(null)}/>`}
      <div className="grid-t">
        <h4>Nota da G1 → quanto precisa na prova da G2</h4>
        <div className="tiles">${tiles.map(t => html`<button key=${t.i} className=${'tile ' + t.c + (Math.round(G1) === t.i ? ' cur' : '')} onClick=${() => setG1(t.i)} title=${'Simular G1 = ' + t.i}>
          <small>${t.i}</small><b>${t.c === 'ok' ? '✓' : t.c === 'bad' ? '✕' : fmt(t.x)}</b></button>`)}</div>
        <div className="legend"><span><i style=${{ background: 'var(--ok)' }}/>garantido</span><span><i style=${{ background: 'var(--lav)' }}/>tranquilo</span><span><i style=${{ background: 'var(--warn)' }}/>apertado</span><span><i style=${{ background: 'var(--bad)' }}/>exame</span></div>
      </div>
    </div>
    <div className="sim-out">
      <${Img} name="simulador" className="res-img"/>
      <${Ring} v=${Math.max(0, Math.min(pMax, s.prova))} max=${pMax} tone=${tone} size=${170} stroke=${14}>
        <strong style=${{ fontSize: 44 }}><${Num} v=${Math.max(0, s.prova)}/></strong><small>/ ${fmt(pMax)} na prova</small>
      <//>
      <h3>${h}</h3><p>${p}</p>
      <p className="mono">G2 = (${fmt(3 * min)} − G1) ÷ 2 = ${fmt(s.alvo)}</p>
    </div>
  </section>`;
}

function Painel({ open, onClose, children, className }) {

    const esc = e => e.key === 'Escape' && onClose();

  if (!open) return null;
  return html`<div><div className="veu" ref=${veu} onClick=${onClose}/><div className=${className + (className === 'modal' ? ' card' : '')} ref=${box} role="dialog" aria-modal="true" data-lenis-prevent>${children}</div></div>`;
}

// ---------- resumo de uma disciplina (menu, cartões do painel) ----------
function resumoCurto(r) {
  const s = r.status;
  if (s === 'vazio') return { tone: '', label: 'Sem notas', txt: 'Comece colocando as notas.', v: null, max: 10 };
  if (s === 'falta') {
    const p = r.precisa;
    if (p.valor <= EPS) return { tone: 'ok', label: 'Garantido', txt: `Já passou, mesmo com 0 no ${r.falta}.`, v: p.max, max: p.max, show: '✓' };
    if (p.valor <= p.max + EPS) return { tone: p.valor / p.max > .8 ? 'warn' : 'peach', label: 'Em andamento', txt: `Precisa de ${fmt(p.valor)} de ${fmt(p.max)} no ${r.falta}.`, v: p.valor, max: p.max };
    return { tone: 'bad', label: 'Direto não dá', txt: 'Vai para o exame.', v: p.max, max: p.max, show: '!' };
  }
  const porStatus = {
    aprovado: { tone: 'ok', label: 'Aprovado', txt: 'Passou direto.' },
    exame: { tone: 'warn', label: 'Exame final', txt: `Precisa de ${fmt(r.efPrecisa ?? 0)} no exame.` },
    impossivel: { tone: 'bad', label: 'Em risco', txt: 'Só com substituição.' },
    'aprovado-exame': { tone: 'ok', label: 'Aprovado', txt: 'Passou no exame.' },
    reprovado: { tone: 'bad', label: 'Reprovado', txt: 'Não fechou a média.' },
  };
  return { ...porStatus[s], v: r.mf ?? r.mp, max: 10 };
}

// ---------- trilha: G1 → G2 → média → exame → resultado ----------
function Trilha({ r, d }) {
  const exame = ['exame', 'impossivel', 'aprovado-exame', 'reprovado'].includes(r.status);
  const ok = r.status === 'aprovado' || r.status === 'aprovado-exame' || (r.status === 'falta' && r.precisa.valor <= EPS);
  const bad = r.status === 'reprovado' || r.status === 'impossivel';
  const steps = [{ k: 'G1', v: r.G1, sub: 'peso 1' }, { k: 'G2', v: r.G2, sub: 'peso 2' }, { k: 'Média', v: r.mp, sub: 'mínimo ' + fmt(r.min) }];
  if (exame) steps.push({ k: 'Exame', v: num(d.ef), sub: 'vale 10' });
  const cur = ok || bad ? -1 : steps.findIndex(s => s.v == null);
  return html`<section className="card trilha anim-in" aria-label="Etapas da disciplina"><div className="tr">
    ${steps.map((s, i) => html`<div key=${s.k} className=${'tr-step' + (s.v != null ? ' done' : '') + (i === cur ? ' cur' : '')}>
      <div className="tr-node">${s.v != null ? fmt(s.v) : '?'}</div><b>${s.k}</b><small>${i === cur ? 'falta esta' : s.sub}</small></div>`)}
    <div className=${'tr-step fim' + (ok ? ' done ok' : bad ? ' done bad' : '')}>
      <div className="tr-node">${ok ? '✓' : bad ? '✕' : '?'}</div><b>${ok ? 'Aprovado' : bad ? 'Reprovado' : 'Resultado'}</b><small>${ok || bad ? 'fim' : 'no fim do semestre'}</small></div>
  </div></section>`;
}

    <section className="card agenda anim-in">
      ${linhas.map(l => html`<div key=${l.d.id} className="ag cr">
        <button className="cr-nome" onClick=${() => abrir(l.i)} title="Abrir disciplina"><i className=${'dot ' + (l.ok ? 'ok' : '')}/> <b>${l.d.nome || 'Sem nome'}</b></button>
        <label className="cr-in"><${Inp} label=${'Créditos de ' + l.d.nome} placeholder="0" value=${l.d.creditos} onChange=${v => setCr(l.i, v)}/><small>créditos</small></label>
        <em>${valor != null && l.cr != null ? reais(l.cr * valor) : '–'}</em>
      </div>`)}
    </section>
    <button className="btn line" onClick=${nova}>${IcPlus} Nova disciplina</button>
  </div>`;
}

// ---------- app ----------
function App() {
  const [db, setDb] = useState(carregar);
  const [tela, setTela] = useState('painel'); // 'painel' | 'disc'
  const [aba, setAba] = useState('notas');
  const [ajustes, setAjustes] = useState(false);
  const [imp, setImp] = useState(false);
  const [prog, setProg] = useState(null);
  const [toast, setToast] = useState(null);
  const [arrastando, setArrastando] = useState(false);
  const d = db.lista[db.cur];
  const r = avaliar(d);

  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { } }, [db]);
  const set = fn => setDb(p => ({ ...p, lista: p.lista.map((x, i) => i === p.cur ? fn(x) : x) }));
  const setGrau = k => fn => set(x => ({ ...x, [k]: fn(x[k]) }));
  const avisar = (msg, err) => { setToast({ msg, err, id: Date.now() }); clearTimeout(avisar.t); avisar.t = setTimeout(() => setToast(null), 4200); };
  const topo = () => window.__lenis ? window.__lenis.scrollTo(0, { immediate: true }) : scrollTo(0, 0);
  const irPainel = () => { setTela('painel'); topo(); };
  const abrir = i => { setDb(p => ({ ...p, cur: i })); setTela('disc'); setAba('notas'); topo(); };

  const importarTexto = txt => {
    const p = parseCanvas(txt);
    if (!p.g1 && !p.g2) { avisar('Não achei G1 nem G2 aí. É a página de notas do Canvas?', true); return false; }
    setDb(prev => {
      const lista = prev.lista.slice(); let cur = prev.cur, alvo = { ...lista[cur] };
      // só reaproveita a disciplina aberta se ela estiver em branco; senão cria outra (nunca sobrescreve a errada)
      const emBranco = x => /^(Minha|Nova) disciplina$/.test(x.nome) && ['g1', 'g2'].every(k => { const c = calcGrau(x[k], false); return !c.known && !c.e; });
      const curso = p.curso ? nomeBonito(p.curso) : null;
      const i = curso ? lista.findIndex(x => x.nome === curso) : -1;
      if (i >= 0) { cur = i; alvo = { ...lista[i] }; }
      else if (curso && tela === 'disc' && emBranco(alvo)) alvo.nome = curso;
      else if (curso || tela !== 'disc') {
        const livre = lista.findIndex(emBranco);
        if (livre >= 0) { cur = livre; alvo = { ...lista[livre], nome: curso || lista[livre].nome }; }
        else { alvo = novaDisc(curso || 'Disciplina importada'); lista.push(alvo); cur = lista.length - 1; }
      }
      for (const k of ['g1', 'g2']) if (p[k]) alvo[k] = p[k];
      if (p.sub) alvo.sub = p.sub;
      lista[cur] = alvo;
      return { lista, cur };
    });
    setImp(false); setTela('disc'); setAba('notas'); topo();
    const n = (p.g1?.itens.length || 0) + (p.g2?.itens.length || 0);
    avisar(p.avisos.length ? 'Importado, mas confira: ' + p.avisos.join('; ') : `Pronto! ${n} notas importadas.`, !!p.avisos.length);
    return true;
  };
  const importarArquivo = async file => {
    setImp(true);
    try { const t = await lerArquivo(file, (p, msg) => setProg({ p, msg })); setProg(null); importarTexto(t); }
    catch (e) { setProg(null); avisar('Não consegui ler: ' + e.message, true); }
  };
  const ref = useRef({}); ref.current = { importarTexto, importarArquivo };

  useEffect(() => { // colar e arrastar em qualquer lugar
    const paste = e => {
      const f = e.clipboardData.files[0];
      if (f) { e.preventDefault(); ref.current.importarArquivo(f); return; }
      const t = e.clipboardData.getData('text');
      if (t.length > 40 && /G[12]/.test(t) && !/TEXTAREA/.test(e.target.tagName)) { e.preventDefault(); ref.current.importarTexto(t); }
    };
    let n = 0;
    const enter = e => { if (e.dataTransfer.types.includes('Files')) { n++; setArrastando(true); } };
    const leave = () => { if (--n <= 0) { n = 0; setArrastando(false); } };
    const over = e => e.preventDefault();
    const drop = e => { e.preventDefault(); n = 0; setArrastando(false); const f = e.dataTransfer.files[0]; if (f) ref.current.importarArquivo(f); };
    addEventListener('paste', paste); addEventListener('dragenter', enter); addEventListener('dragleave', leave); addEventListener('dragover', over); addEventListener('drop', drop);
    return () => { removeEventListener('paste', paste); removeEventListener('dragenter', enter); removeEventListener('dragleave', leave); removeEventListener('dragover', over); removeEventListener('drop', drop); };
  }, []);

  useEffect(() => { // rolagem suave
    if (RM) return;
    const l = new Lenis({ lerp: .09 }); window.__lenis = l;
    const tick = t => l.raf(t * 1000);
    gsap.ticker.add(tick); gsap.ticker.lagSmoothing(0);
    return () => { gsap.ticker.remove(tick); l.destroy(); };
  }, []);

  useLayoutEffect(() => { if (T) gsap.from('.side .anim-top', { x: -18, opacity: 0, duration: .6, stagger: .05, ease: 'power3.out', clearProps: 'transform,opacity' }); }, []);
  const corpo = useRef();
  useLayoutEffect(() => { // entrada de cada tela
    if (!T) return;
    gsap.from(corpo.current.querySelectorAll('.anim-in'), { y: 22, opacity: 0, duration: .5, stagger: .05, ease: 'power3.out', clearProps: 'transform,opacity' });
    gsap.from(corpo.current.querySelectorAll('.barra'), { scaleX: 0, duration: 1.1, delay: .4, ease: 'power3.inOut', clearProps: 'transform' });
  }, [tela, aba, db.cur]);

  const nova = () => { setDb(p => ({ lista: [...p.lista, novaDisc('Nova disciplina')], cur: p.lista.length })); setTela('disc'); setAba('notas'); topo(); setTimeout(() => document.querySelector('.titulo')?.select(), 60); };
  const apagar = () => {
    if (!confirm(`Apagar "${d.nome}"? As notas dela somem deste navegador.`)) return;
    setDb(p => { const lista = p.lista.filter((_, i) => i !== p.cur); return { lista: lista.length ? lista : [novaDisc('Minha disciplina')], cur: 0 }; });
    setAjustes(false); irPainel();
  };
  const exportar = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
    a.download = 'notas-backup.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  const restaurar = async file => {
    try {
      const v = JSON.parse(await file.text());
      if (!Array.isArray(v?.lista) || !v.lista.length || !v.lista.every(x => x.g1 && x.g2)) throw 0;
      if (!confirm(`Trocar as ${db.lista.length} disciplinas de agora pelas ${v.lista.length} do backup?`)) return;
      setDb({ lista: v.lista.map(x => ({ ...novaDisc(x.nome || 'Sem nome'), ...x, g1: { ...grauVazio(), ...x.g1 }, g2: { ...grauVazio(), ...x.g2 } })), cur: 0 });
      setAjustes(false); irPainel(); avisar('Backup restaurado.');
    } catch { avisar('Esse arquivo não é um backup da calculadora.', true); }
  };

  return html`<div className="shell">
    <aside className="side">
      <svg className="deco" viewBox="0 0 272 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" fill="none">
        <path d="M0 78 H150 L190 118" stroke="#48d1e0" stroke-width="1.2"/>
        <path d="M272 520 L200 600 V760" stroke="#8c84ff" stroke-width="1.2"/>
        <circle cx="250" cy="880" r="90" stroke="#48d1e0" stroke-width="1.2"/>
        <circle cx="250" cy="880" r="58" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
      </svg>
      <div className="logo anim-top"><i>${Ic.check}</i><span>Passei<small>modelo de notas da ULBRA</small></span></div>
      <nav className="side-list" aria-label="Menu" data-lenis-prevent>
        <button className=${'nav anim-top' + (tela === 'painel' ? ' on' : '')} onClick=${irPainel}>${IcHome}<span className="nm">Painel</span></button>
        <button className=${'nav anim-top' + (tela === 'creditos' ? ' on' : '')} onClick=${() => { setTela('creditos'); topo(); }}>${IcCred}<span className="nm">Créditos</span></button>
        <div className="side-lbl anim-top">Disciplinas</div>
        ${db.lista.map((x, i) => { const rx = avaliar(x), c = resumoCurto(rx), on = tela === 'disc' && i === db.cur; return html`<button key=${x.id} className=${'nav anim-top' + (on ? ' on' : '')} onClick=${() => abrir(i)} title=${x.nome}>
          <i className=${'dot ' + c.tone}/><span className="nm">${x.nome || 'Sem nome'}</span>${rx.mp != null && html`<span className="mp">${fmt(rx.mf ?? rx.mp)}</span>`}</button>`; })}
        <button className="nav add anim-top" onClick=${nova}>${IcPlus}<span className="nm">Nova disciplina</span></button>
      </nav>
      <div className="side-foot anim-top">
        <button className="btn peach" onClick=${() => setImp(true)}>${Ic.up} Importar</button>
        <small>Salvo só neste navegador.<br/>Projeto de aluno, sem vínculo oficial com a ULBRA.</small>
      </div>
    </aside>

    <main className="content"><div className="wrap" ref=${corpo}>
      ${tela === 'painel' ? html`<${PainelView} db=${db} abrir=${abrir} nova=${nova} importar=${() => setImp(true)}/>`
      : tela === 'creditos' ? html`<${CreditosView} db=${db} setDb=${setDb} abrir=${abrir} nova=${nova}/>` : html`<div>
        <div className="ph anim-in">
          <div className="ph-main">
            <div className="crumb"><button onClick=${irPainel}>Painel</button> / disciplina</div>
            <input className="titulo" aria-label="Nome da disciplina" title="Clique para renomear" value=${d.nome} onChange=${e => set(x => ({ ...x, nome: e.target.value }))} onKeyDown=${e => e.key === 'Enter' && e.target.blur()}/>
          </div>
          <div className="ph-act">
            <button className="btn line" onClick=${() => setImp(true)}>${Ic.up} Importar</button>
            <button className="btn line" onClick=${() => setAjustes(true)}>${Ic.gear} Ajustes</button>
          </div>
        </div>
        <${Trilha} r=${r} d=${d}/>
        <${Resultado} r=${r} d=${d} set=${set}/>
        <div className="tabs"><${Seg} label="Seção" value=${aba} onChange=${setAba} options=${[['notas', 'Minhas notas'], ['sim', 'Simulador']]}/></div>
        ${aba === 'notas'
          ? html`<div className="graus">
              <${Grau} key=${d.id + 'g1'} k="g1" g=${d.g1} gr=${r.g1} setG=${setGrau('g1')} min=${r.min} usado=${r.subUsada === 'G1'}/>
              <${Grau} key=${d.id + 'g2'} k="g2" g=${d.g2} gr=${r.g2} setG=${setGrau('g2')} min=${r.min} usado=${r.subUsada === 'G2'}/>
            </div>`
          : html`<${Simulador} key=${d.id} r=${r}/>`}
        <div className="sec-h" style=${{ marginTop: 40 }}><h2>Como é calculado</h2><span>modelo de notas da ULBRA</span></div>
        <div className="forms" style=${{ marginTop: 0 }}>
          <div className="card fc anim-in">
            <div className="eq"><div className="frac"><span>G1 + (G2 × 2)</span><i className="barra" style=${{ background: 'var(--mint)' }}/><span>3</span></div><span>=</span><span className="res">MP</span></div>
            <p>Média parcial. Precisa de ${fmt(r.min)} para passar direto.</p>
          </div>
          <div className="card fc anim-in">
            <div className="eq"><div className="frac"><span>MP + (EF × 2)</span><i className="barra" style=${{ background: 'var(--peach)' }}/><span>3</span></div><span>=</span><span className="res">MF</span></div>
            <p>Média final, se for para o exame. Também precisa de ${fmt(r.min)}.</p>
          </div>
        </div>
      </div>`}
    </div></main>

    <${Ajustes} open=${ajustes} onClose=${() => setAjustes(false)} d=${d} set=${set} apagar=${apagar} exportar=${exportar} restaurar=${restaurar}/>
    <${Importar} open=${imp} onClose=${() => { if (!prog) setImp(false); }} onArquivo=${importarArquivo} onTexto=${importarTexto} prog=${prog}/>
    ${arrastando && html`<div className="dragzone">Solte para importar</div>`}
    <${Toast} t=${toast}/>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);
</script>
</body>
</html>
